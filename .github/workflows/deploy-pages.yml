name: Deploy site to GitHub Pages
on: { push: { branches: [main], paths: ["site/**", ".github/workflows/deploy-pages.yml"] }, workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      GOOGLE_ENABLED: ${{ vars.GOOGLE_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build site folder (uses repository variables if set, otherwise the committed site/config.js)
        run: |
          mkdir _site
          tar cf - -C site --exclude=tests --exclude=node_modules --exclude=package.json --exclude=tools . | tar xf - -C _site
          node -e 'const u=process.env.SUPABASE_URL,k=process.env.SUPABASE_ANON_KEY;if(u&&k){const c={SUPABASE_URL:u,SUPABASE_ANON_KEY:k,GOOGLE_ENABLED:process.env.GOOGLE_ENABLED==="true"};require("fs").writeFileSync("_site/config.js","window.VF_CONFIG = "+JSON.stringify(c)+";\n");console.log("config.js generated from repository variables")}else{console.log("No repository variables set: keeping the committed site/config.js")}'
      - name: Refuse to publish a secret key
        run: |
          node -e 'global.window={};require("./_site/config.js");const C=require("./site/auth-core.js");const p=C.configProblem(window.VF_CONFIG);console.log("config check:",p||"ok");if(p==="secret_key"){console.error("A secret/service-role key was found in config.js. Remove it and rotate the key in Supabase.");process.exit(1)}'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
