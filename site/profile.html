<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile | Vish Flow</title><meta name="robots" content="noindex">
<link rel="icon" type="image/webp" href="assets/logo-mark.webp">
<script>(function(){var t;try{t=localStorage.getItem("vf-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t})()</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Manrope:wght@400;500;600&display=swap">

<body data-page="profile"><canvas id="wave" aria-hidden="true"></canvas><div class="auth-top"><a class="logo" href="index.html" aria-label="Vish Flow home"><img class="mark" src="assets/logo-mark.webp" alt="" width="44" height="33">Vish Flow</a></div><main class="auth-wrap"><div class="auth-card"><a class="x" href="index.html" aria-label="Close and return to the site">&#10005;</a>
<h1>Profile</h1><p>Your public Vish Flow ID and profile details.</p>
<div class="msg" id="cfgwarn" role="alert" hidden></div>
<div class="msg" id="msg" role="alert" aria-live="polite" hidden></div>
<div class="kv"><b>Vish Flow ID (permanent)</b><span class="idbox" id="pid">…</span></div><button class="btn block ghost" id="copy" type="button">Copy ID</button><div class="kv"><b>Account status</b><span id="status">…</span></div><form id="form" novalidate><label for="f-name">Display name</label><input id="f-name" name="name" type="text" autocomplete="name" maxlength="80"><label for="f-bio">Bio</label><textarea id="f-bio" name="bio" maxlength="500"></textarea><label for="f-vis">Profile visibility</label><select id="f-vis" name="visibility"><option value="private">Private (default)</option><option value="public">Public (shown on verification page)</option></select><p class="note">Your email is never shown publicly. Public verification pages arrive in a later phase.</p><button class="btn pri" type="submit">Save profile</button></form><a class="btn block ghost" href="dashboard.html">Back to dashboard</a>
<div class="auth-panel"><b>Learn. Build. Grow.</b><span>Powered by Code With Vishesh</span></div>
</div></main>
